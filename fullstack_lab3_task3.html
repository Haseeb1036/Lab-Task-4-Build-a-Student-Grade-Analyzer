<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Grade Calculator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 40px;
            background-color: #eaf4fb;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 330px;
            background-color: white;
            padding: 18px 15px;
            border-radius: 7px;
            box-shadow: 0 2px 7px rgba(0, 0, 0, 0.25);
        }

        h1 {
            margin: 0 0 12px;
            text-align: center;
            font-size: 21px;
            line-height: 1.1;
        }

        label {
            display: block;
            font-size: 11px;
            margin: 7px 0 3px;
        }

        input {
            width: 100%;
            height: 23px;
            padding: 4px 6px;
            border: 1px solid #aaa;
            border-radius: 3px;
            font-size: 10px;
        }

        button {
            width: 100%;
            height: 22px;
            margin-top: 11px;
            border: none;
            border-radius: 3px;
            background-color: #8bdccc;
            color: #333;
            font-size: 9px;
            cursor: pointer;
        }

        button:hover {
            background-color: #73d2c0;
        }

        #result {
            text-align: center;
            margin: 18px 0 3px;
            color: #3d8d50;
            font-size: 11px;
            min-height: 13px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Interactive Grade<br>Calculator</h1>

        <label for="studentName">Student Name:</label>
        <input type="text" id="studentName" placeholder="Enter student name">

        <label for="marks">Marks:</label>
        <input type="number" id="marks" placeholder="Enter marks" min="0" max="100">

        <button onclick="calculateGrade()">Calculate Grade</button>

        <p id="result"></p>
    </div>

    <script>
        function calculateGrade() {
            const studentName = document.getElementById("studentName").value;
            const marks = Number(document.getElementById("marks").value);
            const result = document.getElementById("result");

            let grade;

            if (marks >= 80) {
                grade = "A";
            } else if (marks >= 70) {
                grade = "B";
            } else if (marks >= 60) {
                grade = "C";
            } else if (marks >= 50) {
                grade = "D";
            } else {
                grade = "F";
            }

            if (studentName === "" || marks < 0 || marks > 100 || isNaN(marks)) {
                result.textContent = "Please enter valid information.";
                result.style.color = "red";
                return;
            }

            result.style.color = "#3d8d50";
            result.textContent =
                studentName + " scored " + marks + " marks - Grade " + grade;
        }
    </script>

</body>
</html>
